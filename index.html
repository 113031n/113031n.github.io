<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>아이디어가 필요해!!!!!!!!!!!!!</title>
    <style>
        body {
            margin:0
        }
        img {
            max-width: 100%;
            height: auto;
        }
        div {
            display: flex;
            flex-direction: column;
            margin: 20px;
        }
        a {
            width: fit-content;
        }
    </style>
    <script src="https://unpkg.com/tone"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
</head>
<body>
    <img src="uncanny-cat-gdmi.gif"></img>
    <button id="play">hi</button>
    <div>
        <h1>아이디어가 필요해</h1>
        <a href="ideas/test/">test</a>
        <a href="ideas/스피키/">스핔이</a>
        <a href="ideas/image to rex Progress">렉스 프로그레스 전환기</a>
    </div>
    <script>
        const piano = new Tone.Sampler({
            urls: { C4: "C4.mp3",A4: "A4.mp3" },
            baseUrl: "https://tonejs.github.io/audio/salamander/",
        }).toDestination();
        const square = new Tone.PolySynth(Tone.Synth, {
            oscillator: {
                type: "square"
            },
            volume : -10
        }).toDestination();
        const sawtooth = new Tone.PolySynth(Tone.Synth, {
            oscillator: {
                type: "sawtooth"
            },
            volume : -8
        }).toDestination();
        const triangle = new Tone.PolySynth(Tone.Synth, {
            oscillator: {
                type: "triangle"
            },
            volume : -5
        }).toDestination();
        const sine = new Tone.PolySynth(Tone.Synth, {
            oscillator: {
                type: "sine"
            },
            volume : -5
        }).toDestination();
        const INSTRUMENTS = {
            piano,
            square,
            sawtooth,
            triangle,
            sine
        };
        const MIDIS = [
            'a.mid',
            'aa.mid'
        ]
        let parts = [];

        loadMIDI()
        async function loadMIDI() {
            const response = await fetch(MIDIS[Math.floor(Math.random() * MIDIS.length)]);
            const array = await response.arrayBuffer();
            const midi = new Midi(array);
            Tone.Transport.bpm.value = midi.header.tempos[0].bpm;
            Tone.Transport.PPQ = midi.header.ppq;
            const tracks = [];
            const rm = Math.floor(Math.random() * 7 - 2)
            const keys = Object.keys(INSTRUMENTS);
            const randomKey =
            keys[Math.floor(Math.random() * keys.length)];
            const synth = INSTRUMENTS[randomKey];
            synth.maxPolyphony = 64;
            synth.set({
                envelope: {
                    release: 0.05
                }
            });
            console.log(randomKey, rm)
            for (const track of midi.tracks) {
                const part = new Tone.Part((time, note) => {
                    synth.triggerAttackRelease(
                        Tone.Frequency(note.midi + rm, "midi"),
                        note.duration,
                        time,
                        note.velocity
                    );
                }, track.notes).start(0);
                parts.push(part);
            }
            Tone.Transport.loop = true;
            Tone.Transport.loopStart = 0;
            Tone.Transport.loopEnd = midi.duration;
        }
        let played = false
        const btn = document.getElementById("play")
    btn.addEventListener("click", async () => {
        if (!played){
            played = true
            btn.textContent = "stop";
            await Tone.Transport.start();
        }else{
            played = false
            btn.textContent = "play";
            await Tone.Transport.stop();
            Tone.Transport.cancel();
            Tone.Transport.position = 0;
            parts.forEach(p => p.dispose());
            parts = [];
            loadMIDI()
        }
    });
    </script>
</body>
</html>
